<!DOCTYPE html>
<html>
  <head>
    <title>Account Opening Deposit</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://js.stripe.com/clover/stripe.js"></script>
  </head>
  <body>
    <section>
      <div class="product">
        <div class="description">
          <h3>Deposit Amount:</h3>
        </div>
      </div>
      <form action="/create-checkout-session" method="POST">
        <input class="deposit-input" type="number" name="amount" id="amount" placeholder="e.g. 500.00" step="0.01" required>
        <button type="submit" id="checkout-button">Deposit</button>
      </form>
    </section>
  </body>
</html>
